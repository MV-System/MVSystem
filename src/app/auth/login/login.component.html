
<main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

            

              <div class="card mb-3">

                <div class="card-body ">

                  <!-- <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Log in a MV System</h5>
                  </div> -->
                  <div class="d-flex justify-content-center py-4 pt-4">
                    <img src="assets/img/mv_logo.svg" alt="">
                </div>

                <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="isAlert">
                    <strong> {{showAlert}}</strong> 
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>

                  
                  <form [formGroup]="loginForm" class="row g-3 needs-validation" novalidate
                            (submit)="iniciarSesion()">

                    <div class="col-12">
                      <label for="yourUsername" class="form-label">Usuario</label>
                      <div class="input-group has-validation">
                        <input type="text" name="username" class="form-control" formControlName="userName" required>
                        <div class="invalid-feedback">Por favor ingrese su usuario.</div>
                      </div>
                    </div>

                    <div class="col-12">
                      <label for="yourPassword" class="form-label">Contraseña</label>
                      <div class="input-icon-container ">
                        <input [type]=" showPassword ? 'text' : 'password'" formControlName="password"
                            type="password" class="form-control">
                        <div class="show-pwd" (click)="toggleShowPassword()">
                            <i [ngClass]="showPassword ?'bi bi-eye-slash':'bi bi-eye'"></i>
                        </div>
                    </div>
                    </div>

                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" value="true" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Recuérdame</label>
                      </div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-login w-100" type="submit">
                            <span class="d-inline">{{isLoading?'Iniciando...': 'Iniciar sesion'}} </span>
                            <span class="spinner-border spinner-border-sm m-0 x-10" role="status" aria-hidden="true" *ngIf="isLoading"></span>
                        </button>
                    </div>
                    <!-- <div class="col-12">
                      <p class="small mb-0">Aún no tienes cuenta? <a href="pages-register.html">Create an account</a></p>
                    </div> -->
                  </form>

                </div>
              </div>

              <!-- <div class="credits">
               
              </div> -->

            </div>
          </div>
        </div>

      </section>

    </div>
  </main><!-- End #main -->
