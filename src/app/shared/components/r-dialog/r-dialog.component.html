<r-modal [show]="show">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{title}}</h5>
      </div>
      <div class="modal-body" *ngIf="title">
        <p>{{message}}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">{{btnCancelText}}</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()">{{btnOkText}}</button>
      </div>
    </div>
  </div>
</r-modal>
