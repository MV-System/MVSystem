
<main id="main" class="main">
    <div class="pagetitle">
        <h1 id="registro">Registro Suplidor</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">Mantenimiento</li>
                <li class="breadcrumb-item active">Registro suplidor</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->
<section class="section" >
<div class="row" >
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
              <h5 class="card-title" >Datos del suplidor</h5>

              <!--  Form -->
              <form [formGroup]="formRegistro" 
                    (ngSubmit)="registroSuplidores()"
                    class="row g-3 needs-validation"
                    novalidate>
                    <!-- --------------- DropDown Tipo Suplidor --------------- -->
                  <div class="row">
                    <div class="col-md-4">
                        <label  class="form-label">Tipo suplidor</label>
                            <select formControlName="tipoSuplidor" class="form-select">
                                <!-- <option selected>Choose...</option>
                                <option>...</option> -->
                                <option *ngFor="let tipoSuplidor of listaTipoSuplidores"
                                        [value]="tipoSuplidor.iD_Tipo_Suplidor">
                                {{tipoSuplidor.tipo_Suplidor_Descripcion}}
                                </option>
                            </select>
                    </div>
                    <div class="col-md-8"></div>
                  </div>

                    <!-- --------------- Nombre Suplidor --------------- -->
                <div class="col-md-6">
                    <label class="form-label">Nombre <span class="required-field">*</span></label>
                    <input type="text" 
                            class="form-control" 
                            formControlName="nombre" 
                            aria-describedby="inputGroupPrepend" required
                            [ngClass]="{'is-invalid':validarCampos('nombre')}">
                            <div class="validatorField"  *ngIf="validarCampos('nombre')">
                                Este campo es requerido.
                              </div>
                </div>

                    <!-- --------------- Apellido Suplidor --------------- -->               
                <div class="col-md-6">  
                    <label  class="form-label">Apellido <span class="required-field">*</span></label>
                    <input  type="text" 
                            class="form-control" 
                            required
                            formControlName="apellido"
                            [ngClass]="{'is-invalid':validarCampos('apellido')}">
                            <div class="validatorField"  *ngIf="validarCampos('apellido')">
                                Este campo es requerido.
                            </div>
                </div>

                <!-- --------------- DropDown Tipo Telefono Suplidor --------------- -->
                
                <div class="col-md-6">
                    <label  class="form-label">Tipo Número</label>
                    <select formControlName="tipoTelefono" class="form-select">
                        <option *ngFor="let telefono of listaTipoTelefonos"
                        [value]="telefono.iD_Tipo_Telefono">
                        {{telefono.tipo_Telefono_Descripcion}}
                        </option>
                    </select>
                </div>

                  <!-- --------------- Telefono Suplidor --------------- -->
                <div class="col-md-6">
                    <label class="form-label">
                        Teléfono:
                        <span class="required-field">*</span>
                    </label> 
                    <input  
                    class="form-control"
                    required
                    formControlName="telefono"
                    type="text" 
                    mask="000-000-0000" 
                    [ngClass]="{'is-invalid':validarCampos('telefono')}"
                    />
                    <div class="validatorField" *ngIf="validarCampos('telefono')" >
                        Este campo es requerido.
                    </div>
                </div>

                    <!-- --------------- Extension Teléfono Suplidor --------------- -->
                <div class="col-md-2 ">
                    <label  class="form-label">&nbsp;</label>
                    <div class="form-check">
                        <label >
                            <input  class="form-check-input" 
                                    type="checkbox" 
                                    
                                    (change)="onCheckboxChange($event)">
                                    Ext. No.:
                        </label> 
                    </div>
                </div>

                  <div class="col-md-4">
                    <label  class="form-label">&nbsp;</label>
                    <input type="text"
                            class="form-control" 
                            placeholder="Inserte la extensión "
                            formControlName="extensionNumero">
                  </div>

               

                  <!-- --------------- Email Suplidor --------------- -->
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" 
                        class="form-control"  
                        formControlName="email">
                        <div class="validatorField"  [ngClass]="{'invalid-feedback':!validarCampos('email')}">
                            {{emailErrorMsg}}
                          </div>
                </div>

                <!-- --------------- Provincia Suplidor --------------- -->
                <div class="col-md-6">
                  <label  class="form-label">Provincia</label>
                  <input type="text" 
                        class="form-control" 
                        formControlName="provincia">
                </div>

                <!-- --------------- Sector Suplidor --------------- -->
                <div class="col-md-6">
                    <label  class="form-label">Sector</label>
                    <input type="text" 
                            class="form-control" 
                            formControlName="sector">
                </div>

                <!-- --------------- Calle Suplidor --------------- -->
                <div class="col-md-6">
                  <label class="form-label">Calle</label>
                  <input type="text" 
                        class="form-control" 
                        formControlName="calle">
                </div>

                <!-- --------------- NO. Casa Suplidor --------------- -->
                <div class="col-md-6">
                    <label class="form-label">Casa No.</label>
                    <input type="text"
                            class="form-control" 
                            formControlName="casaNumero">
                </div>
           
                <div class="text-center " >
                  <button class="btn btn-primary" type="submit" [ngClass]="{'disabled':btnDisable()}">Guardar</button>                 
                </div>
              </form>
              <!-- End  Form -->
            </div>
        </div>
    </div>
</div>
</section>

</main>
