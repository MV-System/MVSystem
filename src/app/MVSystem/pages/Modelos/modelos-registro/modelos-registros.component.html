<main id="main" class="main">
  <div class="pagetitle">
      <h1 id="registro">Registro de Modelos</h1>
      <nav>
          <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item">Mantenimiento</li>
              <li class="breadcrumb-item active">Registro Modelos</li>
          </ol>
      </nav>
  </div>
  <!-- End Page Title -->
  <section class="section">
    <div class="row">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Datos del Modelo</h5>

                    <!-- --------------- Marca  --------------- -->
                    <div class="col-md-5">
                      <label class="form-label">Marca</label>
                      <ng-select formControlName="marca" (change)="selectoresMarcaModeloValidator()" required>
                          <ng-option *ngFor="let marca of listaMarca" [value]="marca.iD_Marca">
                              {{marca.descripcion}}
                          </ng-option>
                      </ng-select>
                      <div class="validatorField" *ngIf="validarCampos('marca')">
                          Este campo es requerido.
                      </div>
                  </div>
                    <!--  Form -->
                    <form [formGroup]="formRegistro" (ngSubmit)="registroModelo()" class="row g-3 needs-validation" novalidate>

                        <!-- --------------- Nombre del modelo --------------- -->
                         <div class="col-md-6">
                            <label class="form-label">Nombre Del Modelo<span class="required-field">*</span></label>
                            <input type="text" class="form-control" required formControlName="descripcion" aria-describedby="inputGroupPrepend">

                            <div class="validatorField" *ngIf="validarCampos('nombre')"></div>
                            Este campo es requerido.

                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-primary" type="submit" [ngClass]="{'disabled':btnDisable()}">Guardar</button>
                        </div>


                     </form>
                    <!-- End  Form -->

                </div>

                <div class="col-lg-5">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Modelos agregados</h5>
                            <div>
                                <table class="table table-Secondary">
                                    <thead>
                                        <tr>
                                            <th>Cod.</th>
                                            <th>Modelo</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let Modelo of modeloValorRetorno;let i = index">
                                            <!-- <td>{{i + 1}}</td> -->
                                            <td>{{Modelo.iD_Modelo}}</td>
                                            <td>{{Modelo.descripcion</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- <select class="js-example-basic-multiple" name="states[]" >
                      <option value="AL">Alabama</option>
                        ...
                      <option value="WY">Wyoming</option>
                    </select> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</main>
