<main id="main" class="main">
    <div class="pagetitle">
        <h1 id="registro">Registro de Modelos</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">Mantenimiento</li>
                <li class="breadcrumb-item active">Registro Modelos</li>
            </ol>
        </nav>
    </div>
    <!-- End Page Title -->
    <section class="section">
        <div class="row justify-content-center">
            <div class="col-lg-7 order-lg-1 order-2">
                <div class="card modern-card">
                    <div class="card-body">
                        <div class="form-header mb-4">
                            <h5 class="form-title">
                                <i class="bi bi-phone me-2 text-primary"></i>
                                Datos del Modelo
                            </h5>
                            <p class="form-subtitle">Complete la información para registrar un nuevo modelo</p>
                        </div>
                        <form [formGroup]="formRegistro" (ngSubmit)="registroModelo()" class="modern-form" novalidate style="background: #f8fafd; border-radius: 1rem; box-shadow: 0 2px 8px rgba(24,90,157,0.06); padding: 2rem 1.5rem;">
                            <div class="row g-4 align-items-end">
                                <!-- Marca -->
                                <div class="col-md-6">
                                    <label class="form-label modern-label" style="font-size:1.1rem; color:#185a9d; font-weight:600;">
                                        <i class="bi bi-award me-1"></i>
                                        Marca
                                    </label>
                                    <ng-select formControlName="marca" 
                                               class="modern-select-ng"
                                               placeholder="Seleccione una marca"
                                               (change)="selectoresMarcaModeloValidator()">
                                        <ng-option *ngFor="let marca of marcaListado" [value]="marca.iD_Marca">
                                            {{ marca.descripcion }}
                                        </ng-option>
                                    </ng-select>
                                </div>
                                <!-- Nombre del modelo -->
                                <div class="col-md-6">
                                    <label class="form-label modern-label" style="font-size:1.1rem; color:#185a9d; font-weight:600; display:flex; align-items:center; gap:0.4rem;">
                                        <i class="bi bi-type me-1"></i>
                                        <span>Nombre del Modelo</span>
                                        <span class="required-star" style="color:#e74c3c; font-size:1.2em; margin-left:0.3em;">*</span>
                                    </label>
                                    <input type="text" class="form-control modern-input" required formControlName="descripcion" aria-describedby="inputGroupPrepend" style="font-size:1.08rem; border-radius:0.6rem; background:#f5f7fa; border:1.5px solid #b5c6e0;">
                                    <div class="invalid-feedback" *ngIf="validarCampos('descripcion')">
                                        Este campo es requerido.
                                    </div>
                                </div>
                                <!-- Botón -->
                                <div class="col-12 text-end mt-3">
                                    <button class="btn btn-primary px-5" type="submit" [ngClass]="{'disabled':btnDisable()}" style="font-size:1.08rem; border-radius:0.6rem;">
                                        <i class="bi bi-save me-1"></i> Guardar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 order-lg-2 order-1" *ngIf="modeloValorRetorno.length>0 || listaModelo.length>0">
                <div class="card modern-card h-100">
                    <div class="card-body">
                        <div class="form-header mb-3">
                            <h5 class="form-title">
                                <i class="bi bi-list-check me-2 text-primary"></i>
                                Modelos agregados
                            </h5>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover table-striped modern-table align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th>#</th>
                                        <th>Modelo</th>
                                    </tr>
                                </thead>
                                <tbody formControlName="modelo">
                                    <tr *ngFor="let Modelo of modelosFiltrados; let i = index">
                                        <td><span class="badge bg-primary">{{Modelo.iD_Modelo}}</span></td>
                                        <td><i class="bi bi-phone me-1 text-secondary"></i>{{Modelo.descripcion}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
