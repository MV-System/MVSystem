<span>DashBoard</span>
<main id="main" class="main box" *ngIf="VerFormConsultaUtilidades()">

    <!-- Header del Dashboard -->
    <div class="dashboard-header mb-4">
        <h4 class="mb-0">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard Inteligente
        </h4>
        <p class="text-muted mb-0">Análisis de ventas con IA</p>
    </div>

    <!-- Dashboard Content - Siempre visible, cada widget gestiona su propio loading -->
    <div>

        <!-- Grid de Widgets -->
        <div class="dashboard-grid">

            <!-- Sección: Top Modelos (2 columnas) -->
            <div class="grid-item grid-item-full">
                <div class="two-column-widgets">
                    <!-- Columna Izquierda: Top Modelos Más Vendidos -->
                    <app-top-modelos-widget [fechaInicio]="FechaInicioMes.toISOString().split('T')[0]" [fechaFinal]="fechaHoy.toISOString().split('T')[0]" [limite]="5" [titulo]="'Top 5 Modelos Más Vendidos'" (modeloClicked)="onWidgetInteraction($event)">
                    </app-top-modelos-widget>

                    <!-- Columna Derecha: Top Equipos con Más Tiempo en Inventario -->
                    <app-top-equipos-lentos-widget [limite]="5" [titulo]="'Top 5 Equipos con Más Tiempo en Inventario'" (equipoLentoClicked)="onWidgetInteraction($event)">
                    </app-top-equipos-lentos-widget>
                </div>
            </div>

            <!-- Gráfico: Ventas del Día -->
            <div class="grid-item">
                <div class="dashboard-card p-3">
                    <div class="grafico-seccion">
                        <label class="form-label">
              <i class="bi bi-calendar-day me-2"></i>
              Este Día
            </label>
                        <div class="grafico-responsive">
                            <ngx-charts-advanced-pie-chart [view]="view" [scheme]="colorScheme" [results]="singleVentasDia" [gradient]="gradient" (select)="onSelect($event)">
                            </ngx-charts-advanced-pie-chart>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gráfico: Ventas de la Semana -->
            <div class="grid-item">
                <div class="dashboard-card p-3">
                    <div class="grafico-seccion">
                        <label class="form-label">
              <i class="bi bi-calendar-week me-2"></i>
              Esta Semana
            </label>
                        <div class="grafico-responsive">
                            <ngx-charts-advanced-pie-chart [view]="view" [scheme]="Neon" [results]="singleVentasSemana" [gradient]="gradient" (select)="onSelect($event)" (activate)="onActivate($event)" (deactivate)="onDeactivate($event)">
                            </ngx-charts-advanced-pie-chart>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gráfico: Ventas del Mes -->
            <div class="grid-item">
                <div class="dashboard-card p-3">
                    <div class="grafico-seccion">
                        <label class="form-label">
              <i class="bi bi-calendar-month me-2"></i>
              Este Mes
            </label>
                        <div class="grafico-responsive">
                            <ngx-charts-advanced-pie-chart [view]="view" [scheme]="Ordinal" [results]="singleVentasMes" [gradient]="gradient" (select)="onSelect($event)" (activate)="onActivate($event)" (deactivate)="onDeactivate($event)">
                            </ngx-charts-advanced-pie-chart>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>
