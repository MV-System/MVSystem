<span>DashBoard</span>
<main id="main" class="main box" *ngIf="VerFormConsultaUtilidades()">
  <label class="form-label">Ventas</label>
  <div class="row">
    <mat-spinner *ngIf="isLoading" class="loading">
      <div class="spinner"></div>
      <span>Cargando Dashboard, por favor espere...</span>
    </mat-spinner>
    <div *ngIf="!isLoading" class="col-12">
      <div class="dashboard-card p-3">
        <div class="grafico-seccion mb-4">
          <label class="form-label">Este Día</label>
          <div class="grafico-responsive">
            <ngx-charts-advanced-pie-chart
              [view]="view"
              [scheme]="colorScheme"
              [results]="singleVentasDia"
              [gradient]="gradient"
              (select)="onSelect($event)">
            </ngx-charts-advanced-pie-chart>
          </div>
        </div>
        <div class="grafico-seccion mb-4">
          <label class="form-label">Esta Semana</label>
          <div class="grafico-responsive">
            <ngx-charts-advanced-pie-chart
              [view]="view"
              [scheme]="Neon"
              [results]="singleVentasSemana"
              [gradient]="gradient"
              (select)="onSelect($event)"
              (activate)="onActivate($event)"
              (deactivate)="onDeactivate($event)">
            </ngx-charts-advanced-pie-chart>
          </div>
        </div>
        <div class="grafico-seccion">
          <label class="form-label">Este Mes</label>
          <div class="grafico-responsive">
            <ngx-charts-advanced-pie-chart
              [view]="view"
              [scheme]="Ordinal"
              [results]="singleVentasMes"
              [gradient]="gradient"
              (select)="onSelect($event)"
              (activate)="onActivate($event)"
              (deactivate)="onDeactivate($event)">
            </ngx-charts-advanced-pie-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
