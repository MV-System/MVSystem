
  <app-main [title]="'Consulta Facturas'" 
            [breadcrumb]="'Consulta'"
            [breadcrumbItem]="'Consulta Facturas'">
        <!-- End Page Title -->
        <section class="section">
          <div class="row">
            <div class="col-lg-12">
              <div class="card">
                <div class="card-body">                
                    <!-- <button class="btn clear-filter" (click)="clearFilters($event)">Limpiar filtros  <i class="ri-filter-off-line"></i></button> -->
                  <div class="search-bar mt-3">
                    <!-- form -->
                    <form [formGroup]="form" role="search">
                      <div class="row">
                        <div class="col-lg-8">
                          <div class="card">
                            <div class="card-body">
                              <span class="card-title">Filtros</span>
                              <div class="row">
                            
                                <div class="col-md-7 mb-3">
                                <!-- bar search and criterios de busqueda -->
                                 <li class="nav-item dropdown pe-3 "style="list-style-type: none;">
                                  <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
                                    <form class="search-form d-flex align-items-center">
                                      <input type="text" class="form-control" placeholder="Search" title="Enter search keyword">
                                      <button type="submit" title="Search"><i class="bi bi-sliders"></i></button>
                                    </form>
                                  </a>
                               
                  
                                  <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
                                      <li class="dropdown-header">
                                          <h6>Criterios de búsqueda</h6>
                                      </li>
                                      <li>
                                          <hr class="dropdown-divider">
                                      </li>
                                      <li>
                                         <a class="dropdown-item d-flex align-items-center" >
                                           <input class="mx-2" type="radio" name="" id="">Todos
                                         </a>
                                     </li>
                                     <li>
                                         <hr class="dropdown-divider">
                                     </li>
                                      <li>
                                          <a class="dropdown-item d-flex align-items-center" >
                                            <input class="mx-2" type="radio" name="" id="">Por mayor
                                          </a>
                                      </li>
                                      <li>
                                          <hr class="dropdown-divider">
                                      </li>
                                      <li>
                                         <a class="dropdown-item d-flex align-items-center" >
                                           <input class="mx-2" type="radio" name="" id="">Por detalle
                                         </a>
                                     </li>
                                     <li>
                                         <hr class="dropdown-divider">
                                     </li>
                                      <li>
                                            <a class="dropdown-item d-flex align-items-center" >
                                              <input class="mx-2" type="radio" name="" id="">Nombre Cliente
                                            </a>
                                      </li>
                                      <li>
                                          <hr class="dropdown-divider">
                                      </li>
                  
                                      <li>
                                          <!-- <a class="dropdown-item d-flex align-items-center" href="pages-faq.html"> -->
                                            <a class="dropdown-item d-flex align-items-center" >
                                              <input class="mx-2" type="radio" name="" id="">NO. Factura
                                            </a>
                                      </li>
                                      <li>
                                          <hr class="dropdown-divider">
                                      </li>
                  
                                      <li>
                                        <a class="dropdown-item d-flex align-items-center" >
                                          <input class="mx-2" type="radio" name="" id="">Reparaciones
                                        </a>
                                      </li>
                                      <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                      <li>
                                        <!-- <input type="radio" name="" id="">Por mayor -->
                                         <a class="dropdown-item d-flex align-items-center" >
                                           <input class="mx-2" type="radio" name="" id="">Desbloqueos
                                         </a>
                                     </li>
                                     <li>
                                         <hr class="dropdown-divider">
                                     </li>
                                     
                                     <li>
                                      <!-- <input type="radio" name="" id="">Por mayor -->
                                       <a class="dropdown-item d-flex align-items-center" >
                                         <input class="mx-2" type="radio" name="" id="">Por telefono
                                       </a>
                                   </li>
                                   <li>
                                       <hr class="dropdown-divider">
                                   </li>
                                   
                                   <li>
                                    <!-- <input type="radio" name="" id="">Por mayor -->
                                     <a class="dropdown-item d-flex align-items-center" >
                                       <input class="mx-2" type="radio" name="" id="">Anuladas
                                     </a>
                                 </li>
                                 <li>
                                     <hr class="dropdown-divider">
                                 </li>
                                 
                                 <li>
                                  <!-- <input type="radio" name="" id="">Por mayor -->
                                   <a class="dropdown-item d-flex align-items-center" >
                                     <input class="mx-2" type="radio" name="" id="">Comprobantes
                                   </a>
                               </li>
                         
                                  </ul>
                                  <!-- End Profile Dropdown Items -->
                              </li>
                                </div>
                                <div class="row mx-2">
                                  <div class="col-md-5">
                                    <label class="form-label ">Fecha de facturación</label>
                                    <my-date-range-picker
                                      [options]="myDateRangePickerOptions"
                                      formControlName="rangeDate"
                                      (dateRangeChanged)="onDateRangeChanged($event)"
                                      placeholder=" {{ 01 / 01 / 2005 | date }} -  {{
                                        rangeDatePlaceholder | date
                                      }}"  >
                                    </my-date-range-picker>
                                  </div>
                                  <div class="col-md-5">
                                    <!-- Search by almacen -->
            
                                    <label class="form-label">Almacen</label>
                                    <select class="form-select" formControlName="almacen"
                                    (change)="getFacturas()" >
                                      <option
                                        *ngFor="let almacen of facturas"
                                        [value]="almacen.iD_Almacen == 7? 0 : almacen.iD_Almacen" >
                                        {{ almacen.descripcion }}
                                      </option>
                                    </select>
                                  </div>
                                </div>
                  
                              </div>
                            </div>
                          </div>
                        </div>
    
                        <div class="col-lg-3">
                          <div class="card">
                            <div class="card-body">
                              <!-- Cuadro totales -->
                              <div class="row mx-1 text-center mt-3">
                                <ng-container>
                                  <div class="col-md-12">
                                      <div class="row mb-4 ">
                                        Total de facturas
                                        <label class="form-control total">
                                          {{ facturasQuantity }}
                                        </label>
                                      </div>
                                      <div class="row mb-4 ">
    
                                      Total facturado
                                      <label class="form-control total">
                                        {{ totalFacturado | currency }}
                                      </label>
                                      </div>
                                  </div>
                                </ng-container>
                              </div>
                              <!-- Fin Cuadro totales -->
                            </div>
                          </div>
                        </div>
    
                      </div>
                    </form>
                    <button class="btn print mx-1" (click)="printReportFactura()">
                      Imprimir reporte <i class="bi bi-printer"></i>
                    </button>
                    <!-- end form   -->
                    <app-facturacion-lista 
                    [facturas]="facturas" 
                    [pageIndex]="pageIndex" 
                    [pageSize]="pageSize" 
                    [totalRecord]="totalRecord"
                    [currentPage]="currentPage"
                    [line]="line"
                    [lastLine]="lastLine">
                    <pagination-controls
                     (pageChange)="pageChanged($event)" 
                     [responsive]="true"
                      previousLabel="Anterior"
                      nextLabel="Siguiente"
                      *ngIf="totalRecord >= 10 && facturas.length">
                    </pagination-controls>
                  </app-facturacion-lista>
                    <!-- end lsit -->     
                  </div>
    
                </div>
              </div>
            </div>
          </div>
        </section> 
  </app-main>
