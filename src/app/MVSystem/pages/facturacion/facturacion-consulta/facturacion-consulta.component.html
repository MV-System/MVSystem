<r-loading *ngIf="printing">
</r-loading>


<app-main [title]="'Consulta Facturas'" [breadcrumb]="'Consulta'" [breadcrumbItem]="'Consulta Facturas'">
    <!-- End Page Title -->
    <mat-spinner *ngIf="isLoading" class="loading">
        <div class="spinner"></div>
        <span>Cargando datos, por favor espere...</span>
    </mat-spinner>
    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <!-- form -->
                        <form [formGroup]="form" role="search" class="mt-3">
                            <div class="row">
                                <div class="col-lg-8">

                                    <div class="card">
                                        <span class="card-title">Filtros</span>
                                        <div class="card-body p-2">
                                            <!-- Reducir padding en el card-body -->

                                            <div class="row">
                                                <!-- Filtro de fecha y Sucursal -->
                                                <div class="col-md-4 mb-2" style="padding-top: 0;">
                                                    <!-- Eliminar padding superior aquí -->
                                                    <div class="row">


                                                        <!-- Filtro de Sucursal -->
                                                        <div class="col-md-12" *ngIf="SelectSucursal()" style="padding-top: 0;">
                                                            <!-- Eliminar padding superior aquí -->
                                                            <label class="form-label mb-1">Sucursal</label>
                                                            <select class="form-select" formControlName="almacen" (change)="getFacturas()">
                                                        <option *ngFor="let almacen of almacenes" [value]="almacen.iD_Almacen">
                                                            {{ almacen.descripcion }}
                                                        </option>
                                                    </select>
                                                        </div>
                                                        <!-- Filtro de Fecha -->
                                                        <div class="col-md-12 mb-2" style="padding-top: 0;">
                                                            <!-- Eliminar padding superior aquí -->
                                                            <label class="form-label mt-2">Fecha de facturación</label>
                                                            <my-date-range-picker [options]="myDateRangePickerOptions" formControlName="rangeDate" (dateRangeChanged)="onDateRangeChanged($event)" placeholder=" {{ FechaInicio | date }} - {{ fechaHoy | date }}"></my-date-range-picker>
                                                        </div>

                                                    </div>
                                                </div>
                                                <!-- Barra de búsqueda y Comprobante -->
                                                <div class="col-md-8 mb-2">
                                                    <!-- Barra de búsqueda -->
                                                    <div class="d-flex flex-column">

                                                        <label class="form-label mb-6">Caja de Búsqueda</label>
                                                        <input type="text" class="form-control mb-1" formControlName="criterio" placeholder="Search" title="Busqueda" (keyup)="getFacturas()" />

                                                        <!-- Comprobante (input radio) debajo del input de búsqueda -->
                                                        <label *ngIf="CheckComprobante()" class="form-check-label d-flex align-items-center mt-4">
  <input
      type="radio"
      name="accesorio"
      value="1"
      class="form-check-input"
      (change)="onCheckboxComprobanteChange($event)"
  />
  Comprobantes
</label>
                                                    </div>
                                                </div>


                                            </div>
                                        </div>
                                    </div>



                                    <div class="row">
                                        <div class="col-md-6">
                                            <button class="btn print" [ngClass]="{'disabled': !facturas.length}" (click)="printReportFacturaConsulta()">
                                              Imprimir reporte <i class="bi bi-printer"></i>
                                          </button>
                                        </div>

                                        <div class="col-md-6">
                                            <button class="btn print" [ngClass]="{'disabled': (!onFacturaButton)}" (click)="ReimprimeFactura()">
                                              <span class="d-inline">{{isLoading ? 'Procesando...' : 'Reimprimir Factura'}}</span>
                                              <span class="spinner-grow spinner-grow-sm m-0 x-10" role="status" aria-hidden="true" *ngIf="isLoading"></span>
                                          </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <div class="card">
                                        <div class="card-body">
                                            <!-- Cuadro totales -->
                                            <div class="row mx-1 text-center mt-3">
                                                <ng-container>
                                                    <div class="col-md-12">
                                                        <div class="row mb-4 ">
                                                            Total de facturas
                                                            <label class="form-control total">
                                          {{ facturasCantidad }}
                                        </label>
                                                        </div>
                                                        <div class="row mb-4 ">

                                                            Total facturado
                                                            <label class="form-control total">
                                        {{ totalFacturado | currency }}
                                      </label>
                                                        </div>
                                                    </div>


                                                </ng-container>
                                            </div>
                                            <!-- Fin Cuadro totales -->
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </form>

                        <div *ngIf="!isLoading" class="row">

                            <!-- <div class="col-md-3">
                                <button class="btn print" [ngClass]="{'disabled':!facturas.length}" (click)="printReportFacturaConsulta()">
                          Imprimir reporte <i class="bi bi-printer"></i>
                        </button>

                            </div>

                            <div class="col-md-3">
                                <button class="btn print mx-1" [ngClass]="{'disabled':(!onFacturaButton) }" (click)="ReimprimeFactura()">
                                  <span class="d-inline">{{isLoading?'Procesando...': 'Reimprimir Factura'}} </span>
                                  <span class="spinner-grow spinner-grow-sm m-0 x-10"
                                  role="status"
                                  aria-hidden="true"
                                  *ngIf="isLoading"></span>
                        </button>
                            </div> -->
                        </div>

                        <!-- Controles de Paginación -->
                        <!-- end form   -->
                        <app-facturacion-lista (pageSizeChanged)="onPageSizeChange($event)" [facturas]="facturas" [detalleFactura]="detalleFactura" [pageIndex]="pageIndex" [pageSize]="pageSize" [totalRecord]="totalRecord" [currentPage]="currentPage" [line]="line" [lastLine]="lastLine"
                            (onFacturaButton)="onFacturaButton = $event" (numerofactura)="getDetalleFactura($event)">
                            <!-- <div *ngIf="equiposVendidos.length > 0"> -->
                            <pagination-controls (pageChange)="pageChanged($event)" [currentPage]="pageIndex" [totalItems]="totalRecord" [itemsPerPage]="pageSize">
                            </pagination-controls>

                            <!-- <pagination-controls (pageChange)="pageChanged($event)" [responsive]="true" previousLabel="Anterior" nextLabel="Siguiente" *ngIf="totalRecord >= 10 && facturas.length">
                            </pagination-controls> -->
                        </app-facturacion-lista>
                        <!-- end lsit -->

                    </div>
                </div>
            </div>
        </div>
    </section>
</app-main>
