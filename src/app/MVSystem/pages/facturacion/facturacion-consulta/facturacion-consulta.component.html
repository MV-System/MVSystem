<r-loading *ngIf="printing">
</r-loading>


<app-main [title]="'Consulta Facturas'" [breadcrumb]="'Consulta'" [breadcrumbItem]="'Consulta Facturas'">
    <!-- End Page Title -->
    <mat-spinner *ngIf="isLoading" class="loading">
        <div class="spinner"></div>
        <span>Cargando datos, por favor espere...</span>
    </mat-spinner>
    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <!-- form -->
                        <!-- Totales en una sola fila, encima de los filtros -->
                        <!-- Statistics Cards Modernas (igual que accesorios, con nuevos estilos) -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="card stats-card">
                                    <div class="card-body">
                                        <div class="stats-content">
                                            <div class="stats-icon">
                                                <i class="bi bi-receipt-cutoff text-primary"></i>
                                            </div>
                                            <div class="stats-info">
                                                <h6 class="stats-title">Total de facturas</h6>
                                                <h3 class="stats-number">{{ getCantidadFacturasCliente() }}</h3>
                                                <small class="stats-subtitle">Facturas en el período</small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card stats-card">
                                    <div class="card-body">
                                        <div class="stats-content">
                                            <div class="stats-icon">
                                                <i class="bi bi-cash-coin text-success"></i>
                                            </div>
                                            <div class="stats-info">
                                                <h6 class="stats-title">Total facturado</h6>
                                                <h3 class="stats-number">{{ getTotalFacturadoCliente() | currency }}</h3>
                                                <small class="stats-subtitle">Monto total en el período</small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <form [formGroup]="form" role="search">
                            <div class="filter-header mb-3">
                                <h6 class="filter-title">
                                    <i class="bi bi-funnel me-2 text-primary"></i>
                                    Filtros de Búsqueda
                                </h6>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label modern-label">
                                        <i class="bi bi-search me-1"></i>
                                        Buscar por cliente, # de factura
                                    </label>
                                    <input type="text" class="form-control modern-input"
                                           placeholder="Ej: Cliente, número de factura..."
                                           formControlName="criterio"
                                           (keydown.enter)="$event.preventDefault()">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label modern-label">
                                        <i class="bi bi-calendar-range me-1"></i>
                                        Fecha de facturación
                                    </label>
                                    <my-date-range-picker [options]="myDateRangePickerOptions" formControlName="rangeDate" (dateRangeChanged)="onDateRangeChanged($event)" placeholder="{{ FechaInicio | date }} - {{ fechaHoy | date }}" class="modern-datepicker"></my-date-range-picker>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label modern-label">
                                        <i class="bi bi-person-badge me-1"></i>
                                        Vendedor
                                    </label>
                                    <select class="form-select modern-select vendedor-dropdown"
                                    formControlName="iD_Vendedor"
                                    (change)="getFacturas()">
                                        <option value="">Todos</option>
                                        <option *ngFor="let vendedor of vendedores" [value]="vendedor.iD_Vendedor">
                                            {{ vendedor.nombres || vendedor.nombre }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4" *ngIf="SelectSucursal()">
                                    <label class="form-label modern-label">
                                        <i class="bi bi-building me-1"></i>
                                        Sucursal
                                    </label>
                                    <select class="form-select modern-select"
                                            formControlName="almacen"
                                            (change)="getFacturas()">
                                        <option value="" disabled>Seleccione una sucursal</option>
                                        <option *ngFor="let almacen of almacenes" [value]="almacen.iD_Almacen">
                                            {{almacen.descripcion}}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <div *ngIf="CheckComprobante()" class="form-check form-check-inline ms-2">
                                        <input type="checkbox" name="accesorio" value="1" class="form-check-input modern-check" (change)="onCheckboxComprobanteChange($event)" />
                                        <label class="form-check-label modern-radio-label">
                                            <i class="bi bi-file-earmark-check me-1 text-info"></i>
                                            Comprobantes
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <!-- Botones de acción modernos en una sola fila debajo de los filtros -->
                            <div class="row g-3 mb-4 mt-2">
                                <div class="col-md-6">
                                    <button class="button-imprimir-reporte w-100"
                                        [ngClass]="{'disabled': !facturas.length}"
                                        (click)="printReportFacturaConsulta()">
                                        <i class="bi bi-printer me-2"></i>
                                        <span class="d-none d-sm-inline">Imprimir reporte</span>
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <button class="button-imprimir-reporte w-100"
                                        [ngClass]="{'disabled': (!onFacturaButton)}"
                                        (click)="ReimprimeFactura()">
                                        <i class="bi bi-arrow-repeat me-2"></i>
                                        <span class="d-inline">{{isLoading ? 'Procesando...' : 'Reimprimir Factura'}}</span>
                                        <span class="spinner-grow spinner-grow-sm m-0 x-10 ms-2" role="status" aria-hidden="true" *ngIf="isLoading"></span>
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div *ngIf="!isLoading" class="row">
                       
                        </div>

                        <!-- Controles de Paginación -->
                        <!-- end form   -->
                        <app-facturacion-lista (pageSizeChanged)="onPageSizeChange($event)" [facturas]="facturasFiltradas()" [detalleFactura]="detalleFactura" [pageIndex]="pageIndex" [pageSize]="pageSize" [totalRecord]="totalRecord" [currentPage]="currentPage" [line]="line" [lastLine]="lastLine" [criterioInput]="criterioActual"
                            (onFacturaButton)="onFacturaButton = $event" (numerofactura)="getDetalleFactura($event)" (onBuscarFacturas)="onBuscarFacturas($event)">
                            <!-- <div *ngIf="equiposVendidos.length > 0"> -->
                            <pagination-controls (pageChange)="pageChanged($event)" [currentPage]="pageIndex" [totalItems]="totalRecord" [itemsPerPage]="pageSize">
                            </pagination-controls>

                            <!-- <pagination-controls (pageChange)="pageChanged($event)" [responsive]="true" previousLabel="Anterior" nextLabel="Siguiente" *ngIf="totalRecord >= 10 && facturas.length">
                            </pagination-controls> -->
                        </app-facturacion-lista>
                        <!-- end lsit -->

                    </div>
                </div>
            </div>
        </div>
    </section>
</app-main>
