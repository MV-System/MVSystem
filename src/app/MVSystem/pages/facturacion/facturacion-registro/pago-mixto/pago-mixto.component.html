<div *ngIf="tipoPagoSeleccionado === 6" class="pago-mixto-detalles" [formGroup]="form">
    <div class="mixto-header">
        <span><i class="bi bi-cash-coin"></i> Pago Mixto</span>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="agregarFilaPago()">
            <i class="bi bi-plus"></i> Agregar
        </button>
    </div>

    <div formArrayName="detallesPagos">
        <div *ngFor="let i of getIndices()" [formGroupName]="i" class="mixto-row">
            <select formControlName="ID_Tipo_Pago" class="form-select form-select-sm" (change)="onTipoPagoChange(i, $event)">
                <option value="">Tipo de pago...</option>
                <option *ngFor="let tipo of getTiposPagoDisponibles(i)" [value]="tipo.iD_Tipo_Pagos">
                    {{ tipo.descripcion_Tipo_Pagos }}
                </option>
            </select>
            <input type="number" formControlName="Monto_Pago" class="form-control form-control-sm monto-input" (input)="onMontoInput(i, $event)" placeholder="0.00" step="0.01" min="0">
            <input *ngIf="requiereReferencia(i)" type="text" formControlName="Numero_Referencia" class="form-control form-control-sm ref-input" placeholder="Ref." maxlength="100">
            <button type="button" class="btn btn-outline-danger btn-sm btn-quitar" (click)="eliminarFilaPago(i)" [disabled]="detallesPagos.length <= 2" title="Quitar">
                <i class="bi bi-x"></i>
            </button>
        </div>
    </div>

    <!-- Saldo pendiente inline (solo si no cuadra) -->
    <div *ngIf="totalFactura > 0 && Math.abs(saldoPendiente) > 0.01" class="saldo-alerta">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span *ngIf="saldoPendiente > 0">Faltan <strong>RD$ {{ saldoPendiente | number: '1.2-2' }}</strong></span>
        <span *ngIf="saldoPendiente < 0">Sobran <strong>RD$ {{ Math.abs(saldoPendiente) | number: '1.2-2' }}</strong></span>
    </div>
    <div *ngIf="totalFactura > 0 && Math.abs(saldoPendiente) <= 0.01 && detallesPagos.valid" class="saldo-ok">
        <i class="bi bi-check-circle-fill"></i> Pagos balanceados
    </div>
</div>
