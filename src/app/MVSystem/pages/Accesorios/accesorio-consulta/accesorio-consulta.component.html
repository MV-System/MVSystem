<div class="animate__animated animate__fadeIn">
  <main id="main" class="main">
    <div class="pagetitle">
      <h1 id="registro">Consulta Accesorios</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item">Consulta</li>
          <li class="breadcrumb-item active">Consulta Accesorios</li>
        </ol>
      </nav>
    </div>
    <!-- End Page Title -->
    <section class="section">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <div class="row mt-3">
                <!-- form -->
                <form [formGroup]="form" role="search">
                  <div class="row">
                    <div class="col-lg-8">
                      <div class="card">
                        <div class="card-body">
                          <span class="card-title">Filtros</span>
                          <div class="row mt-4">
                            <!-- Search IMEI -->
                            <div class="col-md-4">
                              <label class="form-label">Por descripción</label>
                              <div class="col-md-12">
                                <input
                                  class="form-control"
                                  placeholder="Cover Iphone 14 Pro"
                                  formControlName="accesorio" 
                                  (keyup)="getAllAccesorios()"/>
                              </div>
                            </div>
                            <div class="col-md-4">
                              <!-- Search by almacen -->
      
                              <label class="form-label">Almacen</label>
                              <select class="form-select" formControlName="almacen"
                              (change)="getAllAccesorios()" >
                                <option
                                  *ngFor="let almacen of almacenes"
                                  [value]="almacen.iD_Almacen" >
                                  {{ almacen.descripcion }}
                                </option>
                              </select>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-lg-3">
                      <div class="card">
                        <div class="card-body">
                          <!-- Cuadro totales -->
                          <div class="row mx-1 text-center mt-3">
                            <ng-container>
                              <div class="col-md-12">
                                <div class="row">
                                  Total Inventario
                                  <label class="form-control total">
                                    {{ totalInventario | currency }}
                                  </label>
                                </div>
                              </div>
                            </ng-container>
                          </div>
                          <!-- Fin Cuadro totales -->
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
                <!-- end form   -->
                <!-- list accesorios -->
                <!-- (id)="getIdAccesorio($event)" -->

                <app-accesorio-list 
                [accesorios]="accesorios" 
                [pageIndex]="pageIndex" 
                [pageSize]="pageSize" 
                [totalRecord]="totalRecord"
                [currentPage]="currentPage"     >
                <pagination-controls (pageChange)="pageChanged($event)" *ngIf="totalRecord >= 10 && accesorios.length">
                </pagination-controls>
              </app-accesorio-list>
               
                <!-- end lsit -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
