<div class="animate__animated animate__fadeIn">
  <main id="main" class="main">
    <div class="pagetitle">
      <h1 id="registro">Consulta Accesorios</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item">Consulta</li>
          <li class="breadcrumb-item active">Consulta Accesorios</li>
        </ol>
      </nav>
    </div>
    <!-- End Page Title -->
    <section class="section">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <div class="row mt-3">
                <div class="form-check ">
                  <label class="form-check-label">
                    Disponibles
                    <input
                      type="radio"
                      checked
                      name="accesorio"
                      value="1"
                      class="form-check-input"
                      (change)="onCheckboxAccesorioChange($event)"/>
                  </label>
                  <label class="form-check-label mx-5">
                    Vendidos
                    <input
                      type="radio"
                      name="accesorio"
                      value="2"
                      class="form-check-input"
                      (change)="onCheckboxAccesorioChange($event)" />
                  </label>
                  <!-- <ng-container class="form-check-label">
                    
                    <button class="btn clear-filter" (click)="clearFilters($event)">Limpiar filtros  <i class="ri-filter-off-line"></i></button>
                  </ng-container> -->
                </div>
              </div>
              <div class="search-bar mt-3">

                <!-- accesorios disponibles component -->
                <ng-container *ngIf="accesorioTipo == 1">
                <!-- form -->
                <form [formGroup]="form" role="search">
                  <div class="row">
                    <div class="col-lg-8">
                      <div class="card">
                        <div class="card-body">
                          <span class="card-title">Filtros</span>
                          <div class="row mt-4">
                            <!-- Search IMEI -->
                            <div class="col-md-6">
                              <label class="form-label">Por descripción</label>
                              <div class="col-md-12">
                                <input
                                  class="form-control"
                                  placeholder="Cover Iphone 14 Pro"
                                  formControlName="accesorio" 
                                  (keyup)="getAccesorios()"/>
                              </div>
                            </div>
                            <div class="col-md-4">
                              <!-- Search by almacen -->
      
                              <label class="form-label">Almacen</label>
                              <ng-select  formControlName="almacen"
                              (change)="getAccesorios()" >
                                <ng-option
                                  *ngFor="let almacen of almacenes"
                                  [value]="almacen.iD_Almacen" >
                                  {{ almacen.descripcion }}
                                </ng-option>
                              </ng-select>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-lg-3">
                      <div class="card">
                        <div class="card-body">
                          <!-- Cuadro totales -->
                          <div class="row mx-1 text-center mt-3">
                            <ng-container>
                              <div class="col-md-12">
                                  <div class="row mb-4 ">
                                    Total Equipos
                                    <label class="form-control total">
                                      {{ accesorioQuantity }}
                                    </label>
                                  </div>
                                  <div class="row mb-4 ">

                                  Total Inventario
                                  <label class="form-control total">
                                    {{ totalInventario | currency }}
                                  </label>
                                  </div>
                              </div>
                            </ng-container>
                          </div>
                          <!-- Fin Cuadro totales -->
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
                <!-- end form   -->
                <app-accesorio-list 
                [accesorios]="accesorios" 
                [pageIndex]="pageIndex" 
                [pageSize]="pageSize" 
                [totalRecord]="totalRecord"
                [currentPage]="currentPage"
                [line]="line"
                [lastLine]="lastLine">
                <pagination-controls
                 (pageChange)="pageChanged($event)" 
                 [responsive]="true"
                  previousLabel="Anterior"
                  nextLabel="Siguiente"
                  *ngIf="totalRecord >= 10 && accesorios.length">
                </pagination-controls>
              </app-accesorio-list>
                <!-- end lsit -->
              </ng-container>
                <!-- End accesorios disponibles component -->
                <ng-container *ngIf="accesorioTipo == 2">
                  <app-accesorio-vendido></app-accesorio-vendido>
                </ng-container>
              </div>

            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
