<div class="row">
    <div class="col-lg-12">
        <!-- <div class="card-body"> -->
            <form [formGroup]="form">
                <div class="row mb-2">
                    <div class="col-md-4">
                            <label class="form-label">Código
                                <span class="required-field">*</span>
                            </label>
                            <input type="text" formControlName="codigo"  class="form-control" >
                    </div>
                </div>

                    <div class="col-md-9 mb-2">
                            <label class="form-label">Descripción
                                <span class="required-field">*</span>
                            </label>
                            <input type="text" required formControlName="descripcionAccesorio" class="form-control" >
                    </div>
          
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label class="form-label">Costo
                            <span class="required-field">*</span>
                        </label>
                        <input type="number"  formControlName="costoEquipo" class="form-control" >
                    </div>
            
                    <div class="col-md-6">
                        <label class="form-label">Precio por Mayor
                            <span class="required-field">*</span>
                        </label>
                        <input type="number" required formControlName="precioPorMayor" class="form-control" >
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label class="form-label">Precio por Detalle
                            <span class="required-field">*</span>
                        </label>
                        <input type="number" required formControlName="precioDetalle" class="form-control" >
                    </div>
             
                    <div class="col-md-6">
                        <label class="form-label">Cantidad
                            <span class="required-field">*</span>
                        </label>
                        <input type="number"
                                required 
                                formControlName="cantidad" 
                                class="form-control" 
                                appNumeric 
                                [maxlen]="4">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Estado
                            <span class="required-field">*</span>
                        </label>
                        <select class="form-select" formControlName="estado" type="number">
                            <option value="A">Activo</option>
                            <option value="I">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-3">
                        <button save class="btn btn-primary" (click)="updateAccesorio()">Guardar</button>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-primary" (click)="clearForm()">Limpiar <i class="ri-filter-off-line"></i></button>
                    </div>
                    <div class="col-md-3">
                        <ng-content select="[cancel]"></ng-content>
                    </div>
                </div>
            </form>
        <!-- </div> -->
