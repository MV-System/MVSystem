<div class="modal fade show d-block modal-fondo" tabindex="-1" role="dialog" aria-modal="true" (click)="closeModal.emit()">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable" (click)="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square me-2"></i> Editar accesorio #{{ form.get('id')?.value }}
                </h5>
                <button type="button" class="btn-close btn-close-white" (click)="closeModal.emit()" [disabled]="isLoading"></button>
            </div>

            <form [formGroup]="form" novalidate (ngSubmit)="updateAccesorio()">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label d-flex flex-row align-items-baseline gap-1">Descripción<span class="text-danger">*</span></label>
                            <input type="text" formControlName="descripcionAccesorio" class="form-control" placeholder="Nombre del accesorio" [class.is-invalid]="form.get('descripcionAccesorio')?.invalid && form.get('descripcionAccesorio')?.touched">
                            <div class="invalid-feedback">{{ getFieldError('descripcionAccesorio') }}</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Código</label>
                            <input type="text" formControlName="codigo" class="form-control" placeholder="ACC-001">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label d-flex flex-row align-items-baseline gap-1">Cantidad en stock<span class="text-danger">*</span></label>
                            <input type="number" formControlName="cantidad" class="form-control" placeholder="0" min="0" appNumeric [class.is-invalid]="form.get('cantidad')?.invalid && form.get('cantidad')?.touched">
                            <div class="invalid-feedback">{{ getFieldError('cantidad') }}</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estado</label>
                            <select formControlName="estado" class="form-select">
                                <option value="A">Activo</option>
                                <option value="I">Inactivo</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label d-flex flex-row align-items-baseline gap-1">Costo<span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">RD$</span>
                                <input type="number" formControlName="costoEquipo" class="form-control" placeholder="0.00" step="0.01" [class.is-invalid]="form.get('costoEquipo')?.invalid && form.get('costoEquipo')?.touched">
                                <div class="invalid-feedback">{{ getFieldError('costoEquipo') }}</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label d-flex flex-row align-items-baseline gap-1">Precio por mayor<span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">RD$</span>
                                <input type="number" formControlName="precioPorMayor" class="form-control" placeholder="0.00" step="0.01" [class.is-invalid]="form.get('precioPorMayor')?.invalid && form.get('precioPorMayor')?.touched">
                                <div class="invalid-feedback">{{ getFieldError('precioPorMayor') }}</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label d-flex flex-row align-items-baseline gap-1">Precio al detalle<span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">RD$</span>
                                <input type="number" formControlName="precioDetalle" class="form-control" placeholder="0.00" step="0.01" [class.is-invalid]="form.get('precioDetalle')?.invalid && form.get('precioDetalle')?.touched">
                                <div class="invalid-feedback">{{ getFieldError('precioDetalle') }}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="closeModal.emit()" [disabled]="isLoading">Cancelar</button>
                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || !isPriceRelationValid() || isLoading">
                        <span class="spinner-border spinner-border-sm me-2" *ngIf="isLoading"></span>
                        {{ isLoading ? 'Guardando…' : 'Guardar cambios' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
