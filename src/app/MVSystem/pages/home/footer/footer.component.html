<main id="main" class="main box">
    <div class="row">

        <div class="box">
            <label class="form-label ">Ventas Del Dia</label>
            <ngx-charts-advanced-pie-chart [view]="view" scheme="cool" [results]="singleVentasDia" (select)="onSelect($event)">
            </ngx-charts-advanced-pie-chart>
        </div>
        <div class="box"> <label class="form-label ">Ventas De la Semana</label>
            <ngx-charts-advanced-pie-chart [view]="view" [scheme]="Neon" [results]="singleVentasSemana" [gradient]="gradient" (select)="onSelect($event)" (activate)="onActivate($event)" (deactivate)="onDeactivate($event)">
            </ngx-charts-advanced-pie-chart>
        </div>

        <div class="box">
            <label class="form-label ">Ventas Del Mes</label>
            <ngx-charts-advanced-pie-chart [view]="view" [scheme]="Ordinal" [results]="singleVentasMes" [gradient]="gradient" (select)="onSelect($event)" (activate)="onActivate($event)" (deactivate)="onDeactivate($event)">
            </ngx-charts-advanced-pie-chart>
        </div>
    </div>
</main>
