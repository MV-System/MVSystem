<main id="main" class="main">
  <div class="row">
  <div class="col-md-5">
    <label class="form-label row mx-2">Fecha de registro</label>
    <my-date-range-picker [options]="myDateRangePickerOptions" formControlName="rangeDate"
    (dateRangeChanged)="onDateRangeChanged($event)" placeholder=" {{ FechaInicio | date }} -  {{fechaHoy | date}}">
    </my-date-range-picker>
</div>
  </div>
  <label class="form-label ">Ventas</label>

  <ngx-charts-pie-grid
  [view]="view"
  [scheme]="colorScheme"
  [results]="singleVentas"
  (select)="onSelect($event)">
  </ngx-charts-pie-grid>

  <label class="form-label ">Ganancias</label>
  <ngx-charts-advanced-pie-chart
  [view]="view"
  [scheme]="colorScheme"
  [results]="singleGanancias"
  [gradient]="gradient"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
  (deactivate)="onDeactivate($event)"
  >
</ngx-charts-advanced-pie-chart>

<label class="form-label ">Costos</label>
<ngx-charts-advanced-pie-chart
  [view]="view"
  [scheme]="colorScheme"
  [results]="singleCostos"
  [gradient]="gradient"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
  (deactivate)="onDeactivate($event)"
  >
</ngx-charts-advanced-pie-chart>
</main>
