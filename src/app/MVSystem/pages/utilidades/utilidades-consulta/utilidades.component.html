<main id="main" class="main">
  <div class="row">
  <div class="col-md-5">
    <label class="form-label row mx-2">Fecha de registro</label>
    <my-date-range-picker [options]="myDateRangePickerOptions" formControlName="rangeDate" (dateRangeChanged)="onDateRangeChanged($event)" placeholder=" {{ 01 / 01 / 2005 | date }} -  {{
rangeDatePlaceholder | date
}}">
    </my-date-range-picker>
</div>
  </div>
  <ngx-charts-advanced-pie-chart
  [view]="view"
  [scheme]="colorScheme"
  [results]="single"
  [gradient]="gradient"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
  (deactivate)="onDeactivate($event)"
  >
</ngx-charts-advanced-pie-chart>
</main>
