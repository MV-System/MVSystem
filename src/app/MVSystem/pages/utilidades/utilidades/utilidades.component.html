<p>utilidades works!</p>
<main>
  <div class="pagetitle">
    <h1 id="cambiarEstatusEquipo">Ver Utilidades</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item">Mantenimiento</li>
            <li class="breadcrumb-item active">Utilidades</li>
        </ol>
    </nav>
</div>
<section>
  <div class="row">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Accesorios</h5>
                <!--  Form -->
                <form [formGroup]="UtilidadesForm" class="row g-3 needs-validation" novalidate>
                    <!-- --------------- IMEI  --------------- -->
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Accesorios</label>
                            <input type="text" class="form-control" maxlength="16"
                                formControlName="imei"[readonly]=true>

                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Equipos</label>
                            <input type="text" class="form-control" maxlength="16"
                            formControlName="imei"[readonly]=true>
                        </div>
                    </div>


                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Reparaciones</label>
                            <input type="text" class="form-control" maxlength="16"
                            formControlName="imei"[readonly]=true>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Desbloqueos</label>
                            <input type="text" class="form-control" maxlength="16"
                            formControlName="imei"[readonly]=true>
                        </div>
                    </div>

                </form>
                <!-- End  Form -->
            </div>
        </div>
    </div>
</div>
</section>
</main>
