<main id="main" class="main">
    <div class="pagetitle">
        <h1 id="cambiarEstatusEquipo">Cambiar estatus a Equipo</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">Mantenimiento</li>
                <li class="breadcrumb-item active">Cambiar estatus a equipo</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card modern-card">
                    <div class="card-body">
                        <div class="form-header mb-4">
                            <h5 class="form-title">
                                <i class="bi bi-arrow-repeat me-2 text-primary"></i> Consulta IMEI de equipo
                            </h5>
                            <p class="form-subtitle">Modifique el estatus y valores del equipo</p>
                        </div>
                        <!--  Form -->
                        <form [formGroup]="cambiarEstadoForm" class="modern-form row g-3 needs-validation" novalidate>
                            <!-- --------------- IMEI  --------------- -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">IMEI <span class="required-star">*</span></label>
                                <input type="text" class="form-control modern-input" maxlength="30" placeholder="Enter para realizar búsqueda" formControlName="imei" (keyup.enter)="obtenerEquipoByImei()" [readonly]="existeEquipo">
                            </div>
                            <!-- Estatus -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Estatus <span class="required-star">*</span></label>
                                <select formControlName="condicionId" class="form-select modern-select">
                                    <option *ngFor="let estado of equipoCondicionCatalogo" [value]="estado?.iD_Condicion">
                                        {{estado?.descripcion}}
                                    </option>
                                </select>
                            </div>
                            <!-- Costo -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Costo <span class="required-star">*</span></label>
                                <input type="text" class="form-control modern-input" maxlength="15" formControlName="costoEquipo" currencyMask placeholder="RD$" required [ngClass]="{'is-invalid':validarCampos('costoEquipo') && existeEquipo}">
                                <div class="invalid-feedback" *ngIf="validarCampos('costoEquipo') && existeEquipo">
                                    {{mensajeErrorCampoCosto}}
                                </div>
                            </div>
                            <!-- Precio Por Mayor -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Precio Por Mayor  <span class="required-star">*</span></label>
                                <input type="text" class="form-control modern-input" maxlength="15" formControlName="precioPorMayor" currencyMask placeholder="RD$" required [ngClass]="{'is-invalid':validarCampos('precioPorMayor') && existeEquipo}">
                                <div class="invalid-feedback" *ngIf="validarCampos('precioPorMayor') && existeEquipo">
                                    {{mensajeErrorCampoPrecioMayor}}
                                </div>
                            </div>
                            <!-- Precio de Detalle -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Precio de Detalle  <span class="required-star">*</span></label>
                                <input type="text" class="form-control modern-input" maxlength="15" formControlName="precioDetalle" currencyMask placeholder="RD$" required [ngClass]="{'is-invalid':validarCampos('precioDetalle') && existeEquipo}">
                                <div class="invalid-feedback" *ngIf="validarCampos('precioDetalle') && existeEquipo">
                                    {{mensajeErrorCampoPrecioDetalle}}
                                </div>
                            </div>
                            <!-- Comision Por Mayor -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Comisión Por Mayor</label>
                                <input type="text" class="form-control modern-input" maxlength="13" formControlName="comisionMayor" currencyMask placeholder="RD$">
                            </div>
                            <!-- Comision de Detalle -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Comisión de Detalle</label>
                                <input type="text" class="form-control modern-input" maxlength="13" formControlName="comisionDetalle" currencyMask placeholder="RD$">
                            </div>
                            <!-- DropDown Desbloqueado -->
                            <div class="col-md-6">
                                <label class="form-label modern-label">Desbloqueado <span class="required-star">*</span></label>
                                <select formControlName="estadoBloqueoId" class="form-select modern-select">
                                    <option *ngFor="let estado of equipoEstadosBloqueoCatalogo" [value]="estado?.iD_Bloqueo">
                                        {{estado?.descripcion}}
                                    </option>
                                </select>
                            </div>
                        </form>
                        <div class="pt-3 text-end">
                            <button class="button-guardar w-100" (click)="cambiarEstatus()" [disabled]=!existeEquipo>
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>

                        </div>
                        <!-- End  Form -->
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
