<main id="main" class="main">
    <div class="pagetitle">
        <h1>Laptops</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">Mantenimiento</li>
                <li class="breadcrumb-item active">Laptops</li>
            </ol>
        </nav>
    </div>

    <div class="mb-3" *ngIf="verCambioPieza && verCustodia">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="vistaLaptops" id="vistaCambio" [checked]="vista === 'CAMBIO'" (change)="vista = 'CAMBIO'">
            <label class="form-check-label" for="vistaCambio"><i class="bi bi-motherboard me-1 text-primary"></i>Cambio de pieza</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="vistaLaptops" id="vistaCustodia" [checked]="vista === 'CUSTODIA'" (change)="vista = 'CUSTODIA'">
            <label class="form-check-label" for="vistaCustodia"><i class="bi bi-box-seam me-1 text-warning"></i>Custodia de piezas</label>
        </div>
    </div>

    <app-laptop-cambio-pieza *ngIf="vista === 'CAMBIO' && verCambioPieza"></app-laptop-cambio-pieza>
    <app-laptop-custodia *ngIf="vista === 'CUSTODIA' && verCustodia"></app-laptop-custodia>
</main>
