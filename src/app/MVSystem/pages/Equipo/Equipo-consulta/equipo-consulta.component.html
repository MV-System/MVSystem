          <div class="card-body">
            <div class="row mt-3">

              <ul class="nav nav-tabs nav-tabs-bordered"  role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active"  
                          value="1"
                          data-bs-toggle="tab" 
                           type="button" 
                           role="tab"  
                           aria-selected="true"
                           (click)="onCheckboxEquipoChange(1)">Disponibles</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" 
                           value="2"
                          data-bs-toggle="tab" 
                          type="button" 
                          role="tab" 
                          aria-selected="false"
                          (click)="onCheckboxEquipoChange(2)">Vendidos</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" 
                          value="3"
                          data-bs-toggle="tab" 
                          type="button" 
                          role="tab"  
                          aria-selected="false"
                          (click)="onCheckboxEquipoChange(3)">Recibidos</button>
                </li>
                <ng-container class="form-check-label ">

                  <button class="btn clear-filter mb-2" (click)="clearFilters($event)">Limpiar filtros <i
                      class="ri-filter-off-line"></i></button>
                </ng-container>
              </ul>
            </div>
            <div class=" mt-3">
              <app-equipo-disponible [clearFilter]="filter" *ngIf="equipoTipotab == disponible"></app-equipo-disponible>
              <app-equipo-consulta-vendido [clearFilter]="filter" *ngIf="equipoTipotab == vendido">
              </app-equipo-consulta-vendido>
              <app-equipo-consulta-recibido [clearFilter]="filter" *ngIf="equipoTipotab == recibido">
              </app-equipo-consulta-recibido>
            </div>
