<main id="main" class="main">
  <div class="pagetitle">
    <h1 id="registro">Consulta Equipos</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item">Consulta</li>
        <li class="breadcrumb-item active">Consulta equipos</li>
      </ol>
    </nav>
  </div>
  <!-- End Page Title -->
  <section class="section">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body">
            <div class="row mt-3">
           
              <!-- <i class="bi bi-funnel"></i> -->
              <div class="form-check ">
                <label class="form-check-label">
                  Disponible
                  <input
                    type="radio"
                    checked
                    name="equipo"
                    value="1"
                    class="form-check-input"
                    (change)="onCheckboxEquipoChange($event)"/>
                </label>
                <label class="form-check-label mx-5">
                  Vendidos
                  <input
                    type="radio"
                    name="equipo"
                    value="2"
                    class="form-check-input"
                    (change)="onCheckboxEquipoChange($event)" />
                </label>
                <ng-container class="form-check-label">
                  
                  <button class="btn clear-filter" (click)="clearFilters($event)">Limpiar filtros  <i class="ri-filter-off-line"></i></button>
                </ng-container>
                
              </div>
            </div>
            <div class="search-bar mt-3">
              <app-equipo-disponible
                [clearFilter]="filter"
                *ngIf="equipoTipo == 1"></app-equipo-disponible>
              <app-equipo-consulta-vendido
                [clearFilter]="filter"

                *ngIf="equipoTipo == 2"></app-equipo-consulta-vendido>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<!-- End #main -->
