<app-main title="Permisos" breadcrumb="Seguridad" breadcrumbItem="Permisos">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Gestión de Permisos</h5>
                        <button class="btn btn-primary btn-sm" (click)="abrirFormulario()">
              <i class="bi bi-plus-circle"></i> Nuevo Permiso
            </button>
                    </div>

                    <div *ngIf="loading" class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>

                    <div class="table-responsive" *ngIf="!loading && permisos.length > 0">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Módulo</th>
                                    <th>Básico</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let permiso of permisos">
                                    <td>{{permiso.codigo}}</td>
                                    <td>{{permiso.nombre}}</td>
                                    <td>{{permiso.descripcion}}</td>
                                    <td>{{permiso.nombreModulo}}</td>
                                    <td>
                                        <span *ngIf="permiso.basico === 1" class="badge bg-info">Sí</span>
                                        <span *ngIf="permiso.basico !== 1" class="badge bg-secondary">No</span>
                                    </td>
                                    <td>
                                        <span *ngIf="permiso.estado === 1" class="badge bg-success">Activo</span>
                                        <span *ngIf="permiso.estado === 0" class="badge bg-danger">Inactivo</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-info me-2" (click)="editar(permiso)" title="Editar">
                      <i class="bi bi-pencil"></i>
                    </button>
                                        <button class="btn btn-sm btn-danger" (click)="eliminar(permiso.codigo)" title="Eliminar">
                      <i class="bi bi-trash"></i>
                    </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div *ngIf="!loading && permisos.length === 0" class="alert alert-info">
                        No hay permisos registrados
                    </div>
                </div>
            </div>
        </div>
    </div>
</app-main>

<!-- Modal para Crear/Editar Permiso -->
<div class="modal" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{modalTitle}}</h5>
                <button type="button" class="btn-close" (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre" [(ngModel)]="formulario.nombre" name="nombre" placeholder="Nombre del permiso">
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="descripcion" [(ngModel)]="formulario.descripcion" name="descripcion" rows="3" placeholder="Descripción del permiso"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="modulo" class="form-label">Módulo</label>
                        <select class="form-control" id="modulo" [(ngModel)]="formulario.modulo" name="modulo">
              <option [value]="null">Selecciona un módulo</option>
              <option *ngFor="let modulo of modulos" [value]="modulo.codigo">{{modulo.nombre}}</option>
            </select>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="basico" [(ngModel)]="formulario.basico" name="basico">
                            <label class="form-check-label" for="basico">
                Permiso Básico
              </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-control" id="estado" [(ngModel)]="formulario.estado" name="estado">
              <option [value]="1">Activo</option>
              <option [value]="0">Inactivo</option>
            </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" (click)="guardarPermiso()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- Fondo modal -->
<div class="modal-backdrop fade" [class.show]="showModal" *ngIf="showModal"></div>
