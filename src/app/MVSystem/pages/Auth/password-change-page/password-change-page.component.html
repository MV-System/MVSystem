<app-main [title]="'Cambiar Contraseña'" [breadcrumbItem]="'User'">
    <section class="section">
        <div class="tab-pane  pt-3 " id="profile-change-password">
            <!-- Change Password Form -->
            <form [formGroup]="form" (ngSubmit)="changePasswordUser()">

                <!-- <div class="row mb-3">
                    <label for="currentPassword" class="col-md-4 col-lg-3 col-form-label">Actual Contraseña</label>
                    <div class="input-icon-container col-md-5 col-lg-6">
                        <input name="password"  [type]=" showPassword ? 'text' : 'password'"class="form-control" id="currentPassword">
                        <div class="show-pwd" (click)="toggleShowPassword()">

                            <i [ngClass]="showPassword ?'bi bi-eye-slash':'bi bi-eye'" ></i>
                        </div>
                    </div>
                </div> -->

                <div class="row mb-3">
                    <label for="newPassword" class="col-md-4 col-lg-3 col-form-label">Nueva Contraseña</label>
                    <div class="col-md-5 col-lg-6">
                        <input  class="form-control" 
                                type="password" 
                                id="newPassword" 
                                [ngClass]="{'is-invalid':validateFields('newPassword')}" 
                                formControlName="newPassword">
                        <app-password-strength-meter
                        *ngIf="form.controls.newPassword.value"
                        [password]="form.controls.newPassword.value"
                        (strengthChange)="onStrengthChange($event)"
                        (activePwdInputBtn)="onActiveRenewPwdInput($event)" >
                        </app-password-strength-meter>
                        <div class="validatorField" *ngIf="validateFields('newPassword')">
                            Este campo es requerido.
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="renewPassword" class="col-md-4 col-lg-3 col-form-label">Confirmar Contraseña</label>
                    <div class="col-md-5 col-lg-6">
                        <input formControlName="renewPassword" 
                        type="password" 
                        class="form-control" 
                        id="renewPassword"
                        [readonly]="renewPasswordInput?false:true">
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary" [disabled]="renewPasswordInput?false:true">Cambiar Contraseña</button>
                </div>
            </form><!-- End Change Password Form -->

        </div>
    </section>
</app-main>
