<r-loading *ngIf="isPrint"></r-loading>

<main id="main" class="main">
    <section class="section">
        <div class="row">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body ">
                        <h5 class="card-title text-center">Login</h5>
                        <!--  Form -->
                        <form [formGroup]="loginForm" class="row g-3 needs-validation" novalidate
                            (submit)="IniciarSesion()">

                            <div class="row mt-2">
                                <div class="col-md-9">
                                    <label class="form-label">User</label>
                                    <input formControlName="userName" type="text" class="form-control">
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col-md-9">
                                    <label class="form-label">Password</label>
                                    <input [type]=" showPassword ? 'text' : 'password'"  formControlName="password" type="password" class="form-control">
                                </div>

                                <div class="show-pwd" (click)="toggleShowPassword()">

                                    <i [ngClass]="showPassword ?'bi bi-eye-slash':'bi bi-eye'" ></i>
                                {{showPassword ? 'Ocultar' : 'Mostrar'}}
                                </div>
                        
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-4ce">
                                    <button class="btn btn-primary">Iniciar sesion</button>
                                </div>
                            </div>
                        </form>
                        <!-- End  Form -->
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
